; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit Unified Sensor@^1.1.15

[env:peripheral]
build_src_filter = +<peripheral_main.cpp> -<main.cpp>
; Same dual-driver sensor detection as the other two envs, so a BMP280 fitted
; here is read correctly instead of encoding NaN into the BLE payload.
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BMP280 Library@^3.0.0

[env:central]
build_src_filter = +<central_main.cpp> -<main.cpp>
; Same dual-driver sensor detection as the bedroom env, so a BMP280 swapped
; onto this board is read correctly instead of publishing nulls.
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BMP280 Library@^3.0.0

[env:bedroom]
build_src_filter = +<bedroom_main.cpp> -<main.cpp>
; Both drivers, because the board has had a BMP280 and a BME280 fitted at
; different times and bedroom_main.cpp picks whichever is actually present.
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BMP280 Library@^3.0.0